<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        #media-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%;
            
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        img, video, .gif {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /*Cambiar a 'cover' si se prefiere recortar*/   /*Cambiar a 'contain' si se prefiere ajustar sin recortar*/
            object-position: center; 
            display: block;
        }

        .error-message {
            color: #ff4444;
            padding: 20px;
            font-family: monospace;
            font-size: 14px;
            word-wrap: break-word;
            background-color: rgba(0,0,0,0.8);
        }

        .debug-info {
            color: #44ff44;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            background-color: rgba(0,0,0,0.8);
            position: absolute;
            top: 10px;
            left: 10px;
            max-width: 90%;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div id="media-container"></div>
    <script>
        // Función auxiliar para logging al proceso main
        function logToMain(level, context, message) {
            const msg = (message instanceof Error) ? message.stack : String(message);
            if (window.electronAPI && window.electronAPI.sendRenderLog) {
                window.electronAPI.sendRenderLog(level, context, msg);
            } else {
                console.warn(`[RENDER LOG FALLBACK] [${level}] [${context}] ${msg}`);
            }
        }
        
        logToMain('INFO', 'BG_INIT', 'Ventana de fondo inicializada.');
        
        window.electronAPI.onLoadImages(({ mediaFiles }) => {
            
            try {
                const container = document.getElementById('media-container');
                container.innerHTML = '';
                
                if (!mediaFiles || mediaFiles.length === 0) {
                    logToMain('INFO', 'BG_NO_MEDIA', 'No hay archivos de media asignados a esta ventana.');
                    container.innerHTML = '<div class="debug-info">Sin archivos multimedia asignados a esta ventana</div>';
                    return;
                }

                const media = mediaFiles[0];
                logToMain('INFO', 'BG_MEDIA_PROCESS', `Procesando medio: ${media.name} (${media.type})`);
                
                // Crear elemento según el tipo
                let element;
                if (media.type === 'video') {
                    element = document.createElement('video');
                    element.autoplay = true;
                    element.loop = true;
                    element.muted = true;
                    element.playsinline = true;
                    
                    element.onloadeddata = () => {
                        element.play().then(() => {
                            logToMain('INFO', 'BG_VIDEO_PLAY_OK', `Video '${media.name}' reproduciendo correctamente.`);
                        }).catch(e => {
                            // Este error ocurre si la reproducción automática es bloqueada
                            logToMain('ERROR', 'BG_VIDEO_PLAY_FAIL', `Error al intentar reproducir video: ${e.message}.`);
                            container.innerHTML += '<div class="error-message">Error al reproducir: ' + e.message + '</div>';
                        });
                    };
                } else {
                    element = document.createElement('img');
                    if (media.type === 'gif') {
                        element.classList.add('gif');
                    }
                }
                
                // Manejo de errores mejorado
                element.onerror = (e) => {
                    logToMain('ERROR', 'BG_LOAD_MEDIA_FAIL', `Fallo al cargar el medio '${media.name}' desde '${media.src}'.`);
                    container.innerHTML = `
                        <div class="error-message">
                            <strong>ERROR: No se pudo cargar el archivo</strong><br><br>
                            Tipo: ${media.type}<br>
                            Nombre: ${media.name}<br>
                            Ruta: ${media.src}<br><br>
                            Verifica que:<br>
                            1. El archivo existe en la ubicación<br>
                            2. El formato es compatible (png, jpg, gif, mp4)<br>
                            3. No hay espacios o caracteres especiales en la ruta
                        </div>
                    `;
                };
                
                element.onload = () => {
                    logToMain('INFO', 'BG_IMAGE_LOAD_OK', `Imagen/GIF '${media.name}' cargada exitosamente.`);
                };
                
                // Agregar al contenedor y establecer src
                container.appendChild(element);
                element.src = media.src;
                
                logToMain('INFO', 'BG_ELEMENT_SET', `Elemento ${media.type} creado y fuente establecida.`);

            } catch (e) {
                // Captura cualquier error inesperado en el flujo de lógica de carga
                logToMain('FATAL', 'BG_RENDER_CRASH', e);
            }
        });
        
        logToMain('INFO', 'BG_LISTENERS_READY', 'Listeners registrados, esperando evento load-images...');
    </script>
</body>
</html>
