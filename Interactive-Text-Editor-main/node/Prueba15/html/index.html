<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pantalla de Caja Dinamica</title>
<style>
  body { margin:0; padding:0; background-color:transparent; color:#fff; font-family:Consolas, monospace; font-size:28px; height:100vh; overflow:hidden; }
  body.font-small { font-size:150%; }
  #banner-top, #banner-bottom { position:fixed; width:100%; height:100px; display:flex; justify-content:center; align-items:center; background:transparent; z-index:10; }
  #banner-top { top:0; } #banner-bottom { bottom:0; }
  #banner-top img, #banner-bottom img { height:100%; width:auto; max-width:100%; }
  #content-wrapper { position:absolute; top:100px; bottom:100px; left:0; right:0; overflow-y:auto; padding:20px; }
  #content { white-space:pre-wrap; line-height:1.2; text-align:center; }
  .content-container { background-color:#1e1e1e; width:100%; height:100%; }
  img.draggable-media, video.draggable-media { position:fixed; cursor:grab; z-index:9999; user-select:none; width:auto; height:150px; }
  img.mobile { width:auto; height:150px; }
  img.mobile-banner { height:100%; width:auto; margin:0 6px; }
  .welcome { display:block; margin:50px auto 20px; max-width:300px; height:auto; }
  .welcome-text { text-align:center; font-size:22px; color:#aaa; }
  .keyboard-hint { position:fixed; bottom:10px; right:10px; background-color:rgba(0,0,0,0.7); color:#888; padding:8px 12px; border-radius:4px; font-size:12px; font-family:Arial, sans-serif; z-index:1000; opacity:0.5; transition:opacity 0.3s; }
  .keyboard-hint:hover { opacity:1; }
  .keyboard-hint kbd { background-color:#333; border:1px solid #555; border-radius:3px; padding:2px 6px; font-family:monospace; font-size:11px; }
</style>
</head>
<body>
<div class="content-container">
  <div id="banner-top"></div>
  <div id="content-wrapper"><div id="content"></div></div>
  <div id="banner-bottom"></div>
  <div class="keyboard-hint"><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>R</kbd> para cambiar configuracion</div>
</div>

<script>
const contentDiv = document.getElementById('content');
const wrapper = document.getElementById('content-wrapper');
const body = document.body;
let currentWindowSize = null;

const saveMobilePositions = () => {
  const positions = {};
  document.querySelectorAll('.draggable-media').forEach(el => {
    positions[el.src] = { left: el.style.left, top: el.style.top };
  });
  localStorage.setItem('mobilePositions', JSON.stringify(positions));
  console.log('[SAVE] Posiciones guardadas');
};

const getSavedPosition = src => {
  try { return JSON.parse(localStorage.getItem('mobilePositions')||'{}')[src] || null; }
  catch(e){ console.error(e); return null; }
};

// Gestion de contenido
window.electronAPI.onFileChange(text => {
  contentDiv.innerHTML = '';
  text.split('\n').forEach(line => {
    const div = document.createElement('div');
    div.textContent = line;
    contentDiv.appendChild(div);
  });
  wrapper.scrollTop = wrapper.scrollHeight;
});

window.electronAPI.onNoFile(({ welcomePath }) => {
  contentDiv.innerHTML = '';
  const wrapperDiv = document.createElement('div');
  wrapperDiv.classList.add('fade-in');

  const welcomeImg = Object.assign(document.createElement('img'), {
    src: welcomePath,
    alt: 'Bienvenido',
    className: 'welcome'
  });

  const msg = Object.assign(document.createElement('div'), {
    textContent: '¡Bienvenido! En breve comenzaremos a atenderle.',
    className: 'welcome-text'
  });

  wrapperDiv.append(welcomeImg, msg);
  contentDiv.appendChild(wrapperDiv);
});

// Carga de imagenes y videos
window.electronAPI.onLoadImages(({ bannersTop, mobileImgs, bannersBottom }) => {
  document.getElementById('banner-top').innerHTML = '';
  document.getElementById('banner-bottom').innerHTML = '';
  bannersTop.forEach(src => { const img = document.createElement('img'); img.src = src; document.getElementById('banner-top').appendChild(img); });
  bannersBottom.forEach(src => { const img = document.createElement('img'); img.src = src; document.getElementById('banner-bottom').appendChild(img); });

  document.querySelectorAll('.draggable-media').forEach(el => el.remove());

  mobileImgs.forEach((src,i) => {
    const isVideo = src.match(/\.(mp4|webm|ogg|mov|avi)$/i);
    const element = document.createElement(isVideo ? 'video' : 'img');
    element.src = src;
    element.classList.add('draggable-media');
    if(isVideo){
      element.loop = true; element.muted = true; element.autoplay = true;
      element.setAttribute('playsinline','');
      element.addEventListener('loadedmetadata',()=>element.play().catch(console.error));
    }

    let pos = currentWindowSize==='3'?getSavedPosition(src):null;
    if(pos){ element.style.left=pos.left; element.style.top=pos.top; }
    else if(currentWindowSize==='3'){ const spacing=window.innerWidth/(mobileImgs.length+1); element.style.left=`${spacing*(i+1)-75}px`; element.style.top='0px'; }
    else{ element.style.left=`${Math.random()*(window.innerWidth-150)}px`; element.style.top=`${Math.random()*(window.innerHeight-150)}px`; }

    document.body.appendChild(element);

    // Drag & Drop
    let dragging=false, offsetX, offsetY;
    element.addEventListener('mousedown', e=>{ dragging=true; offsetX=e.clientX-element.offsetLeft; offsetY=e.clientY-element.offsetTop; element.style.cursor='grabbing'; });
    document.addEventListener('mousemove', e=>{ if(!dragging) return; e.preventDefault(); element.style.left=`${e.clientX-offsetX}px`; element.style.top=`${e.clientY-offsetY}px`; });
    document.addEventListener('mouseup', ()=>{ if(dragging && currentWindowSize==='3') saveMobilePositions(); dragging=false; element.style.cursor='grab'; });
  });
});

// Manejo tamano ventana
window.electronAPI.onWindowSizeSelected(({ size }) => {
  currentWindowSize = String(size);
  body.classList.toggle('font-small', currentWindowSize==='1');
});

// Guardar posiciones al cerrar app
if(window.electronAPI && window.electronAPI.onAppAboutToClose){
  window.electronAPI.onAppAboutToClose(()=>{
    if(currentWindowSize==='3') saveMobilePositions();
    window.electronAPI.saveComplete();
  });
}
</script>

</body>
</html>
