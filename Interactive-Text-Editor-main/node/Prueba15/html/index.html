<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pantalla de Caja Dinámica</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: transparent; 
    color: #fff;
    font-family: Consolas, monospace;
    font-size: 140%;
    height: 100vh;
    overflow: hidden;
  }

  /* --- ESTILO PARA 1/4 DE PANTALLA --- */
  body.font-small {
      font-size: 150%;
  }

  /* Contenedores de banners */
  #banner-top, #banner-bottom {
    position: fixed;
    width: 100%;
    height: 100px;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: transparent;
  }

  #banner-top { top: 0; }
  #banner-bottom { bottom: 0; }

  #banner-top img, #banner-bottom img {
    height: 100%;
    width: auto;
    max-width: 100%;
  }

  #content-wrapper {
    position: absolute;
    top: 100px;
    bottom: 100px; 
    left: 0;
    right: 0;
    overflow-y: auto;
    padding: 20px;
  }

  #content {
    white-space: pre-wrap;
    line-height: 1.2;
    text-align: center;
  }

  .line {
    opacity: 1;
  }

  /* Estilos para imagen móvil */
  img.mobile {
    width: auto;
    height: 150px;
    position: fixed;
    cursor: grab;
    z-index: 9999;
    user-select: none;
  }

  /* **NUEVA REGLA CSS:** Ocultar las imágenes móviles por defecto y en tamaños que no sean pantalla completa. 
     El JavaScript controlará la creación, pero esta regla es un seguro. */
  body:not(.full-screen) img.mobile {
      display: none !important;
  }

  .welcome { display: block; margin: 50px auto 20px; max-width: 300px; height: auto; }
  .welcome-text { text-align: center; font-size: 22px; color: #ffffff; }

  .content-container {
    background-color: #1e1e1e; 
    width: 100%;
    height: 100%;
  }

  /* Indicador de atajo de teclado */
  .keyboard-hint {
    position: fixed;
    bottom: 10px;
    right: 10px;
    background-color: rgba(0, 0, 0, 0.7);
    color: #888;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-family: Arial, sans-serif;
    z-index: 1000;
    opacity: 0.5;
    transition: opacity 0.3s;
  }

  .keyboard-hint:hover {
    opacity: 1;
  }

  .keyboard-hint kbd {
    background-color: #333;
    border: 1px solid #555;
    border-radius: 3px;
    padding: 2px 6px;
    font-family: monospace;
    font-size: 11px;
  }

</style>
</head>
<body>
  <div class="content-container">
    <div id="banner-top"></div>
    <div id="content-wrapper">
      <div id="content"></div>
    </div>
    <div id="banner-bottom"></div>
    <div class="keyboard-hint">
      <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> para cambiar configuración
    </div>
  </div>

  <script>
    // Función auxiliar para logging al proceso main
    function logToMain(level, context, message) {
        const msg = (message instanceof Error) ? message.stack : String(message);
        if (window.electronAPI && window.electronAPI.sendRenderLog) {
            window.electronAPI.sendRenderLog(level, context, msg);
        } else {
            console.warn(`[RENDER LOG FALLBACK] [${level}] [${context}] ${msg}`);
        }
    }
    
    // Log informativo de inicio
    logToMain('INFO', 'INDEX_INIT', 'Ventana principal (index.html) cargada.');


    const contentDiv = document.getElementById('content');
    const wrapper = document.getElementById('content-wrapper');
    const body = document.body;

    window.electronAPI.onFileChange((text) => {
        try {
            contentDiv.innerHTML = '';
            const lines = text.split('\n');
            
            lines.forEach(line => {
                const div = document.createElement('div');
                div.textContent = line;
                contentDiv.appendChild(div);
            });
            
            wrapper.scrollTop = wrapper.scrollHeight;
            logToMain('INFO', 'INDEX_FILE_CHANGE', 'Contenido de archivo actualizado.');
        } catch (e) {
            logToMain('ERROR', 'INDEX_FILE_PROCESS_FAIL', e);
        }
    });

    window.electronAPI.onNoFile((data) => {
        try {
            contentDiv.innerHTML = '';
            
            const msg = document.createElement('div');
            msg.textContent = '¡Bienvenido! En breve comenzaremos a atenderle.';
            msg.classList.add('welcome-text');

            const wrapperDiv = document.createElement('div');
            wrapperDiv.classList.add('fade-in');
            
            wrapperDiv.appendChild(msg);
            contentDiv.appendChild(wrapperDiv);
            logToMain('INFO', 'INDEX_WELCOME_SCREEN', 'Mostrando pantalla de bienvenida.');
        } catch (e) {
            logToMain('ERROR', 'INDEX_WELCOME_FAIL', e);
        }
    });

    // SCRIPT DE CARGA DE BANNERS Y IMÁGENES MÓVILES (SOLO EN PANTALLA COMPLETA)
    window.electronAPI.onLoadImages(({ bannersTop, mobileImgs, bannersBottom }) => {
        try {
            const topDiv = document.getElementById('banner-top');
            const bottomDiv = document.getElementById('banner-bottom');
            topDiv.innerHTML = '';
            bottomDiv.innerHTML = '';

            // Load banners
            bannersTop.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                topDiv.appendChild(img);
            });

            bannersBottom.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                bottomDiv.appendChild(img);
            });

            // Remove existing mobile images
            document.querySelectorAll('.mobile').forEach(el => el.remove());

            const isFullScreen = document.body.classList.contains('full-screen');
            
            if (isFullScreen) {
                logToMain('INFO', 'INDEX_LOAD_MOBILES', `Cargando ${mobileImgs.length} imágenes móviles.`);
                // Add mobile images
                mobileImgs.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.classList.add('mobile');
                    // ... (Lógica de posicionamiento y arrastre)
                    img.style.left = Math.random() * (window.innerWidth - 150) + 'px';
                    img.style.top = Math.random() * (window.innerHeight - 150) + 'px';

                    let isDragging = false;
                    let startX, startY;

                    img.addEventListener('mousedown', e => {
                      isDragging = true;
                      startX = e.clientX - img.offsetLeft;
                      startY = e.clientY - img.offsetTop;
                      img.style.cursor = 'grabbing';
                    });

                    document.addEventListener('mousemove', e => {
                      if (!isDragging) return;
                      e.preventDefault();
                      const x = e.clientX - startX;
                      const y = e.clientY - startY;
                      img.style.left = `${x}px`;
                      img.style.top = `${y}px`;
                    });

                    document.addEventListener('mouseup', () => {
                      isDragging = false;
                      img.style.cursor = 'grab';
                    });

                    document.body.appendChild(img);
                });
            } else {
                 logToMain('INFO', 'INDEX_MOBILES_SKIP', 'Imágenes móviles omitidas (no es pantalla completa).');
            }
        } catch (e) {
            logToMain('ERROR', 'INDEX_LOAD_ASSETS_FAIL', e);
        }
    });

    // --- MANEJO DEL TAMAÑO DE VENTANA ---
    window.electronAPI.onWindowSizeSelected(({ size }) => {
        try {
            // Clase para 1/4 pantalla
            if (size === '1') {
                body.classList.add('font-small'); 
            } else {
                body.classList.remove('font-small'); 
            }
            
            // **CLASE CLAVE:** Clase específica para Pantalla Completa ('3')
            if (size === '3') {
                body.classList.add('full-screen');
            } else {
                body.classList.remove('full-screen');
            }
             logToMain('INFO', 'INDEX_SIZE_SET', `Tamaño de ventana aplicado: ${size}.`);
        } catch (e) {
            logToMain('ERROR', 'INDEX_SIZE_SET_FAIL', e);
        }
    });

  </script>
</body>
</html>
