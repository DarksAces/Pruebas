<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pantalla de Caja Dinámica</title>
<style>
  /* --- ESTILO GENERAL --- */
  body {
    margin: 0;
    padding: 0;
    background-color: transparent; 
    color: #fff;
    font-family: Consolas, monospace;
    font-size: 28px;
    height: 100vh;
    overflow: hidden;
  }

  /* Escala para modo 1/4 de pantalla */
  body.font-small {
    font-size: 150%;
  }

  /* --- BANNERS SUPERIOR E INFERIOR --- */
  #banner-top, #banner-bottom {
    position: fixed;
    width: 100%;
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: transparent;
    z-index: 10;
  }

  #banner-top { top: 0; }
  #banner-bottom { bottom: 0; }

  #banner-top img, #banner-bottom img {
    height: 100%;
    width: auto;
    max-width: 100%;
  }

  /* --- CONTENIDO CENTRAL --- */
  #content-wrapper {
    position: absolute;
    top: 100px;
    bottom: 100px;
    left: 0;
    right: 0;
    overflow-y: auto;
    padding: 20px;
  }

  #content {
    white-space: pre-wrap;
    line-height: 1.2;
    text-align: center;
  }

  .content-container {
    background-color: #1e1e1e;
    width: 100%;
    height: 100%;
  }

  /* --- IMÁGENES MÓVILES --- */
  img.mobile, img.mobile-banner {
    position: fixed;
    cursor: grab;
    z-index: 9999;
    user-select: none;
  }

  img.mobile {
    width: auto;
    height: 150px;
  }

  img.mobile-banner {
    height: 100%;
    width: auto;
    margin: 0 6px;
  }

  /* --- MENSAJE DE BIENVENIDA --- */
  .welcome {
    display: block;
    margin: 50px auto 20px;
    max-width: 300px;
    height: auto;
  }

  .welcome-text {
    text-align: center;
    font-size: 22px;
    color: #aaa;
  }

  /* --- INDICADOR DE ATAJOS DE TECLADO --- */
  .keyboard-hint {
    position: fixed;
    bottom: 10px;
    right: 10px;
    background-color: rgba(0, 0, 0, 0.7);
    color: #888;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-family: Arial, sans-serif;
    z-index: 1000;
    opacity: 0.5;
    transition: opacity 0.3s;
  }

  .keyboard-hint:hover {
    opacity: 1;
  }

  .keyboard-hint kbd {
    background-color: #333;
    border: 1px solid #555;
    border-radius: 3px;
    padding: 2px 6px;
    font-family: monospace;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div class="content-container">
    <div id="banner-top"></div>
    <div id="content-wrapper">
      <div id="content"></div>
    </div>
    <div id="banner-bottom"></div>
    <div class="keyboard-hint">
      <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>R</kbd> para cambiar configuración
    </div>
  </div>

  <script>
    const contentDiv = document.getElementById('content');
    const wrapper = document.getElementById('content-wrapper');
    const body = document.body;
    let currentWindowSize = null;

    /* --- FUNCIONES AUXILIARES --- */
    const saveMobilePositions = () => {
      const positions = {};
      document.querySelectorAll('.mobile').forEach(img => {
        positions[img.src] = {
          left: img.style.left,
          top: img.style.top
        };
      });
      localStorage.setItem('mobilePositions', JSON.stringify(positions));
      console.log('[SAVE] Posiciones guardadas en localStorage.');
    };

    const getSavedPosition = src => {
      try {
        const positions = JSON.parse(localStorage.getItem('mobilePositions') || '{}');
        return positions[src] || null;
      } catch (e) {
        console.error('[ERROR] Cargando posiciones guardadas:', e);
        return null;
      }
    };

    /* --- GESTIÓN DE CONTENIDO --- */
    window.electronAPI.onFileChange(text => {
      contentDiv.innerHTML = '';
      text.split('\n').forEach(line => {
        const div = document.createElement('div');
        div.textContent = line;
        contentDiv.appendChild(div);
      });
      wrapper.scrollTop = wrapper.scrollHeight;
    });

    window.electronAPI.onNoFile(({ welcomePath }) => {
      contentDiv.innerHTML = '';
      const wrapperDiv = document.createElement('div');
      wrapperDiv.classList.add('fade-in');

      const welcomeImg = Object.assign(document.createElement('img'), {
        src: welcomePath,
        alt: 'Bienvenido',
        className: 'welcome'
      });

      const msg = Object.assign(document.createElement('div'), {
        textContent: '¡Bienvenido! En breve comenzaremos a atenderle.',
        className: 'welcome-text'
      });

      wrapperDiv.append(welcomeImg, msg);
      contentDiv.appendChild(wrapperDiv);
    });

    /* --- CARGA DE IMÁGENES --- */
    window.electronAPI.onLoadImages(({ bannersTop, mobileImgs, bannersBottom }) => {
      console.log('[RENDERER] onLoadImages:', {
        bannersTop: bannersTop.length,
        mobileImgs: mobileImgs.length,
        bannersBottom: bannersBottom.length,
        currentWindowSize
      });

      const topDiv = document.getElementById('banner-top');
      const bottomDiv = document.getElementById('banner-bottom');
      topDiv.innerHTML = '';
      bottomDiv.innerHTML = '';

      // Render banners
      bannersTop.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        topDiv.appendChild(img);
      });

      bannersBottom.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        bottomDiv.appendChild(img);
      });

      // Limpiar imágenes móviles previas
      document.querySelectorAll('.mobile').forEach(el => el.remove());

      // Render móviles
      mobileImgs.forEach((src, i) => {
        const img = document.createElement('img');
        img.src = src;
        img.classList.add('mobile');

        // --- Posición inicial ---
        let pos = (currentWindowSize === '3') ? getSavedPosition(src) : null;

        if (pos) {
          img.style.left = pos.left;
          img.style.top = pos.top;
          console.log(`[LOAD] Posición restaurada: ${src}`);
        } else if (currentWindowSize === '3') {
          const spacing = window.innerWidth / (mobileImgs.length + 1);
          img.style.left = `${spacing * (i + 1) - 75}px`;
          img.style.top = '0px';
        } else {
          img.style.left = Math.random() * (window.innerWidth - 150) + 'px';
          img.style.top = Math.random() * (window.innerHeight - 150) + 'px';
        }

        document.body.appendChild(img);

        /* --- DRAG & DROP --- */
        let isDragging = false;
        let offsetX, offsetY;

        img.addEventListener('mousedown', e => {
          isDragging = true;
          offsetX = e.clientX - img.offsetLeft;
          offsetY = e.clientY - img.offsetTop;
          img.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', e => {
          if (!isDragging) return;
          e.preventDefault();
          img.style.left = `${e.clientX - offsetX}px`;
          img.style.top = `${e.clientY - offsetY}px`;
        });

        document.addEventListener('mouseup', () => {
          if (isDragging && currentWindowSize === '3') saveMobilePositions();
          isDragging = false;
          img.style.cursor = 'grab';
        });
      });
    });

    /* --- TAMAÑO DE VENTANA --- */
    window.electronAPI.onWindowSizeSelected(({ size }) => {
      currentWindowSize = String(size);
      console.log('[RENDERER] Window size selected:', currentWindowSize);
      body.classList.toggle('font-small', currentWindowSize === '1');
    });
    
    if (window.electronAPI && window.electronAPI.onAppAboutToClose) {
        window.electronAPI.onAppAboutToClose(() => {
            console.log('[RENDERER] Recibida señal de cierre. Intentando guardar posiciones...');
            
            // 1. Condición: Solo guardar si estamos en el modo '3' (pantalla completa)
            if (currentWindowSize === '3') {
                saveMobilePositions();
            } else {
                console.log('[RENDERER] No se guardó la posición, no está en modo 3.');
            }

            // 2. Notifica al proceso principal que el guardado (o no-guardado) ha terminado.
            // Esto permite que el Main proceda a cerrar la ventana.
            window.electronAPI.saveComplete(); 
        });
    }

  </script>
</body>
</html>
