<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pantalla de Caja Dinámica</title>
<style>
  body {
    margin: 0;
    padding: 0;
    /* IMPORTANTE: El fondo transparente permite ver las ventanas de fondo (background.html) 
       si no hay elementos cubriéndolo. */
    background-color: transparent; 
    color: #fff;
    font-family: Consolas, monospace;
    font-size: 140%;
    height: 100vh;
    overflow: hidden; /* Evita barras de desplazamiento en el cuerpo principal */
  }

  /* --- ESTILO PARA 1/4 DE PANTALLA --- 
     Se activa dinámicamente desde JS cuando el tamaño es "1". */
  body.font-small {
      font-size: 150%;
  }

  /* Contenedores de banners (Franjas superior e inferior) */
  #banner-top, #banner-bottom {
    position: fixed;
    width: 100%;
    height: 100px;
    z-index: 10; /* Asegura que estén por encima del texto */
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: transparent;
  }

  #banner-top { top: 0; }
  #banner-bottom { bottom: 0; }

  /* Ajuste de imágenes dentro de los banners para que no se deformen */
  #banner-top img, #banner-bottom img {
    height: 100%;
    width: auto;
    max-width: 100%;
  }

  /* Contenedor del texto que se desplaza (scroll) */
  #content-wrapper {
    position: absolute;
    top: 100px;    /* Deja espacio para el banner superior */
    bottom: 100px; /* Deja espacio para el banner inferior */
    left: 0;
    right: 0;
    overflow-y: auto; /* Permite scroll vertical automático */
    padding: 20px;
  }

  #content {
    white-space: pre-wrap; /* Mantiene los saltos de línea del archivo .txt original */
    line-height: 1.2;
    text-align: center;
  }

  /* Estilos para imagen móvil (flotante/arrastrable) */
  img.mobile {
    width: auto;
    height: 150px;
    position: fixed; /* Posición absoluta respecto a la ventana */
    cursor: grab;    /* Icono de mano abierta */
    z-index: 9999;   /* Capa máxima: siempre encima de todo */
    user-select: none; /* Evita que se seleccione como texto al arrastrar */
  }

  /* **REGLA DE SEGURIDAD:** Oculta las imágenes móviles si NO estamos en pantalla completa. 
     Esto evita que aparezcan "flotando" sobre el escritorio de Windows en modo ventana pequeña. */
  body:not(.full-screen) img.mobile {
      display: none !important;
  }

  .welcome { display: block; margin: 50px auto 20px; max-width: 300px; height: auto; }
  .welcome-text { text-align: center; font-size: 22px; color: #ffffff; }

  /* Fondo oscuro semi-transparente para asegurar legibilidad del texto sobre cualquier fondo */
  .content-container {
    background-color: #1e1e1e; 
    width: 100%;
    height: 100%;
  }

  /* Indicador visual del atajo de teclado para reiniciar */
  .keyboard-hint {
    position: fixed;
    bottom: 10px;
    right: 10px;
    background-color: rgba(0, 0, 0, 0.7);
    color: #888;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-family: Arial, sans-serif;
    z-index: 1000;
    opacity: 0.5;
    transition: opacity 0.3s;
  }

  .keyboard-hint:hover {
    opacity: 1;
  }

  .keyboard-hint kbd {
    background-color: #333;
    border: 1px solid #555;
    border-radius: 3px;
    padding: 2px 6px;
    font-family: monospace;
    font-size: 11px;
  }

</style>
</head>
<body>
  <div class="content-container">
    <div id="banner-top"></div>
    <div id="content-wrapper">
      <div id="content"></div>
    </div>
    <div id="banner-bottom"></div>
    
    <div class="keyboard-hint">
      <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> para cambiar configuración
    </div>
  </div>

  <script>
    // --- COMUNICACIÓN CON EL BACKEND (ELECTRON) ---
    
    // Función auxiliar para enviar logs desde la web hacia el archivo de registro del sistema.
    // Esto es vital para saber qué pasó si la pantalla se pone blanca o falla.
    function logToMain(level, context, message) {
        const msg = (message instanceof Error) ? message.stack : String(message);
        if (window.electronAPI && window.electronAPI.sendRenderLog) {
            window.electronAPI.sendRenderLog(level, context, msg);
        } else {
            console.warn(`[RENDER LOG FALLBACK] [${level}] [${context}] ${msg}`);
        }
    }
    
    logToMain('INFO', 'INDEX_INIT', 'Ventana principal (index.html) cargada.');


    const contentDiv = document.getElementById('content');
    const wrapper = document.getElementById('content-wrapper');
    const body = document.body;

    // EVENTO: Detecta cambios en el archivo 'contenido.txt'
    window.electronAPI.onFileChange((text) => {
        try {
            contentDiv.innerHTML = ''; // Limpia el contenido anterior
            const lines = text.split('\n');
            
            // Crea un div por cada línea para mantener el formato
            lines.forEach(line => {
                const div = document.createElement('div');
                div.textContent = line;
                contentDiv.appendChild(div);
            });
            
            // Auto-scroll hacia abajo para mostrar lo último añadido
            wrapper.scrollTop = wrapper.scrollHeight;
            logToMain('INFO', 'INDEX_FILE_CHANGE', 'Contenido de archivo actualizado.');
        } catch (e) {
            logToMain('ERROR', 'INDEX_FILE_PROCESS_FAIL', e);
        }
    });

    // EVENTO: Se dispara cuando 'contenido.txt' no existe o ha sido borrado (inactividad)
    window.electronAPI.onNoFile((data) => {
        try {
            contentDiv.innerHTML = '';
            
            const msg = document.createElement('div');
            msg.textContent = '¡Bienvenido! En breve comenzaremos a atenderle.';
            msg.classList.add('welcome-text');

            const wrapperDiv = document.createElement('div');
            wrapperDiv.classList.add('fade-in');
            
            wrapperDiv.appendChild(msg);
            contentDiv.appendChild(wrapperDiv);
            logToMain('INFO', 'INDEX_WELCOME_SCREEN', 'Mostrando pantalla de bienvenida.');
        } catch (e) {
            logToMain('ERROR', 'INDEX_WELCOME_FAIL', e);
        }
    });

    // EVENTO: Carga de recursos visuales (Banners y Móviles)
    window.electronAPI.onLoadImages(({ bannersTop, mobileImgs, bannersBottom }) => {
        try {
            const topDiv = document.getElementById('banner-top');
            const bottomDiv = document.getElementById('banner-bottom');
            topDiv.innerHTML = '';
            bottomDiv.innerHTML = '';

            // Inyectar imágenes en banner superior
            bannersTop.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                topDiv.appendChild(img);
            });

            // Inyectar imágenes en banner inferior
            bannersBottom.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                bottomDiv.appendChild(img);
            });

            // Limpiar imágenes móviles anteriores para evitar duplicados
            document.querySelectorAll('.mobile').forEach(el => el.remove());

            // Verificar si estamos en modo Pantalla Completa
            const isFullScreen = document.body.classList.contains('full-screen');
            
            if (isFullScreen) {
                logToMain('INFO', 'INDEX_LOAD_MOBILES', `Cargando ${mobileImgs.length} imágenes móviles.`);
                
                // LÓGICA DE ARRASTRE (DRAG & DROP)
                mobileImgs.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.classList.add('mobile');
                    
                    // Posición inicial aleatoria dentro de la ventana
                    img.style.left = Math.random() * (window.innerWidth - 150) + 'px';
                    img.style.top = Math.random() * (window.innerHeight - 150) + 'px';

                    let isDragging = false;
                    let startX, startY;

                    // Al hacer clic
                    img.addEventListener('mousedown', e => {
                      isDragging = true;
                      startX = e.clientX - img.offsetLeft;
                      startY = e.clientY - img.offsetTop;
                      img.style.cursor = 'grabbing'; // Cambia cursor a "agarrando"
                    });

                    // Al mover el mouse
                    document.addEventListener('mousemove', e => {
                      if (!isDragging) return;
                      e.preventDefault();
                      const x = e.clientX - startX;
                      const y = e.clientY - startY;
                      img.style.left = `${x}px`;
                      img.style.top = `${y}px`;
                    });

                    // Al soltar el clic
                    document.addEventListener('mouseup', () => {
                      isDragging = false;
                      img.style.cursor = 'grab';
                    });

                    document.body.appendChild(img);
                });
            } else {
                 logToMain('INFO', 'INDEX_MOBILES_SKIP', 'Imágenes móviles omitidas (no es pantalla completa).');
            }
        } catch (e) {
            logToMain('ERROR', 'INDEX_LOAD_ASSETS_FAIL', e);
        }
    });

    // EVENTO: Ajuste de tamaño de fuente y clases CSS según la configuración elegida
    window.electronAPI.onWindowSizeSelected(({ size }) => {
        try {
            // Ajuste de tamaño de letra para ventanas pequeñas (1/4)
            if (size === '1') {
                body.classList.add('font-small'); 
            } else {
                body.classList.remove('font-small'); 
            }
            
            // Clase CLAVE para mostrar/ocultar imágenes móviles
            if (size === '3') {
                body.classList.add('full-screen');
            } else {
                body.classList.remove('full-screen');
            }
             logToMain('INFO', 'INDEX_SIZE_SET', `Tamaño de ventana aplicado: ${size}.`);
        } catch (e) {
            logToMain('ERROR', 'INDEX_SIZE_SET_FAIL', e);
        }
    });

  </script>
</body>
</html>
