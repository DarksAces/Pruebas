<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Fondo negro sólido para imágenes transparentes */
            background-color: #000;
            height: 100vh;
            width: 100vw;
        }
        #media-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        img, video, .gif {
            width: 100% !important;
            height: 100% !important;
            /* Usar 'contain' para AJUSTAR la imagen completa (sin recorte) */
            object-fit: contain !important; 
            display: block;
        }
    </style>
</head>
<body>
    <div id="media-container"></div>
    <script>
        window.electronAPI.onLoadImages(({ mediaFiles }) => {
            const container = document.getElementById('media-container');
            container.innerHTML = '';
            
            if (mediaFiles && mediaFiles.length > 0) {
                const media = mediaFiles[0];
                const element = media.type === 'video' 
                    ? document.createElement('video')
                    : document.createElement('img');
                
                // CLAVE: Añadir un listener de error para diagnóstico
                element.onerror = (e) => {
                    console.error("Error al cargar el medio:", media.src, e);
                    container.innerHTML = `<p style="color:red; margin:20px;">ERROR: No se pudo cargar el archivo. Revisar consola (F12) para detalles.</p><p style="color:white; font-size: 12px; word-wrap: break-word;">Ruta esperada: ${media.src}</p>`;
                };
                
                // Primero añadir al contenedor
                container.appendChild(element);

                // Luego asignar la fuente para que el navegador comience a cargarla
                element.src = media.src;
                
                if (media.type === 'video') {
                    element.autoplay = true;
                    element.loop = true;
                    element.muted = true;
                    element.playsinline = true;

                    // Manejo robusto del play
                    element.onloadeddata = () => {
                         element.play().catch(e => {
                             console.warn("Video Play Fallido (posiblemente por permisos/autoplay):", e);
                         });
                    };
                } else if (media.type === 'gif') {
                    element.classList.add('gif');
                }
                
                console.log('Loaded media:', media);
            } else {
                console.log('No media files received for this background window.');
            }
        });
    </script>
</body>
</html>
