<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        #media-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%;
            
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        img, video, .gif {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Esto asegura que la imagen llene el contenedor (con recorte centrado) */
            object-fit: cover; 
            object-position: center; 
            display: block;
        }
    </style>
</head>
<body>
    <div id="media-container"></div>
    <script>
        // Añadir log para debugging
        console.log('Background window cargada');
        
        window.electronAPI.onLoadImages(({ mediaFiles }) => {
            console.log('Recibido evento load-images:', mediaFiles);
            
            const container = document.getElementById('media-container');
            container.innerHTML = '';
            
            if (mediaFiles && mediaFiles.length > 0) {
                const media = mediaFiles[0];
                console.log('Cargando media:', media);
                
                const element = media.type === 'video' 
                    ? document.createElement('video')
                    : document.createElement('img');
                
                element.onerror = (e) => {
                    console.error("Error al cargar el medio:", media.src, e);
                    container.innerHTML = `<p style="color:red; margin:20px;">ERROR: No se pudo cargar el archivo.</p><p style="color:white; font-size: 12px; word-wrap: break-word;">Ruta: ${media.src}</p>`;
                };
                
                element.onload = () => {
                    console.log('Imagen cargada exitosamente:', media.src);
                };
                
                container.appendChild(element);
                element.src = media.src;
                
                if (media.type === 'video') {
                    element.autoplay = true;
                    element.loop = true;
                    element.muted = true;
                    element.playsinline = true;

                    element.onloadeddata = () => {
                         console.log('Video cargado, intentando reproducir...');
                         element.play().catch(e => {
                             console.warn("Video Play Fallido:", e);
                         });
                    };
                } else if (media.type === 'gif') {
                    element.classList.add('gif');
                }
            } else {
                console.log('No hay archivos de media para esta ventana de fondo.');
            }
        });
    </script>
</body>
</html>
