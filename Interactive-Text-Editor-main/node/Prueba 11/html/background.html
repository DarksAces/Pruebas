<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1e1e1e;
            height: 100vh;
            width: 100vw;
        }
        #media-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        img, video {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }
        .gif {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }
    </style>
</head>
<body>
    <div id="media-container"></div>
    <script>
        window.electronAPI.onLoadImages(({ mediaFiles }) => {
            const container = document.getElementById('media-container');
            container.innerHTML = '';
            
            if (mediaFiles && mediaFiles.length > 0) {
                const media = mediaFiles[0];
                const element = media.type === 'video' 
                    ? document.createElement('video')
                    : document.createElement('img');
                
                element.src = media.src;
                if (media.type === 'video') {
                    element.autoplay = true;
                    element.loop = true;
                    element.muted = true;
                    element.playsinline = true;
                } else if (media.type === 'gif') {
                    element.classList.add('gif');
                }
                
                container.appendChild(element);
                console.log('Loaded media:', media);
            }
        });
    </script>
</body>
</html>
