<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        #media-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%;
            
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        img, video, .gif {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /*Cambiar a 'cover' si se prefiere recortar*/   /*Cambiar a 'contain' si se prefiere ajustar sin recortar*/
            object-position: center; 
            display: block;
        }

        .error-message {
            color: #ff4444;
            padding: 20px;
            font-family: monospace;
            font-size: 14px;
            word-wrap: break-word;
            background-color: rgba(0,0,0,0.8);
        }

        .debug-info {
            color: #44ff44;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            background-color: rgba(0,0,0,0.8);
            position: absolute;
            top: 10px;
            left: 10px;
            max-width: 90%;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div id="media-container"></div>
    <script>
        console.log('[BACKGROUND] Ventana de fondo inicializada');
        
        window.electronAPI.onLoadImages(({ mediaFiles }) => {
            console.log('[BACKGROUND] Recibido evento load-images:', mediaFiles);
            
            const container = document.getElementById('media-container');
            container.innerHTML = '';
            
            if (!mediaFiles || mediaFiles.length === 0) {
                console.log('[BACKGROUND] No hay archivos de media para esta ventana de fondo.');
                container.innerHTML = '<div class="debug-info">Sin archivos multimedia asignados a esta ventana</div>';
                return;
            }

            const media = mediaFiles[0];
            console.log('[BACKGROUND] Procesando media:', {
                type: media.type,
                src: media.src,
                name: media.name,
                priority: media.priority
            });
            
            // Crear elemento según el tipo
            let element;
            if (media.type === 'video') {
                element = document.createElement('video');
                element.autoplay = true;
                element.loop = true;
                element.muted = true;
                element.playsinline = true;
                
                element.onloadeddata = () => {
                    console.log('[BACKGROUND] Video cargado, intentando reproducir...');
                    element.play().then(() => {
                        console.log('[BACKGROUND] Video reproduciendo correctamente');
                    }).catch(e => {
                        console.error('[BACKGROUND] Error al reproducir video:', e);
                        container.innerHTML += '<div class="error-message">Error al reproducir: ' + e.message + '</div>';
                    });
                };
            } else {
                element = document.createElement('img');
                if (media.type === 'gif') {
                    element.classList.add('gif');
                }
            }
            
            // Manejo de errores mejorado
            element.onerror = (e) => {
                console.error('[BACKGROUND] Error al cargar el medio:', media.src, e);
                container.innerHTML = `
                    <div class="error-message">
                        <strong>ERROR: No se pudo cargar el archivo</strong><br><br>
                        Tipo: ${media.type}<br>
                        Nombre: ${media.name}<br>
                        Ruta: ${media.src}<br><br>
                        Verifica que:<br>
                        1. El archivo existe en la ubicación<br>
                        2. El formato es compatible (png, jpg, gif, mp4)<br>
                        3. No hay espacios o caracteres especiales en la ruta
                    </div>
                `;
            };
            
            element.onload = () => {
                console.log('[BACKGROUND] Imagen cargada exitosamente:', media.src);
            };
            
            // Agregar al contenedor y establecer src
            container.appendChild(element);
            element.src = media.src;
            
            console.log('[BACKGROUND] Elemento creado y src establecido');
        });
        
        console.log('[BACKGROUND] Listeners registrados, esperando evento load-images...');
    </script>
</body>
</html>
